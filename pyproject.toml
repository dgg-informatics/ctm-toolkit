[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctm-toolkit"
version = "1.0.0"
description = "Clinical trial data normalization and report generation toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Dane Deemer", email = "deemer@umich.edu" }
]
keywords = ["clinical-trials", "matchminer", "oncology", "ctml", "normalization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jinja2",
    "openpyxl",
    "pydantic>=2.0",
    "python-dotenv",
]

[project.optional-dependencies]
report = [
    "weasyprint",
]
preview = [
    "weasyprint",
    "livereload",
]
llm = [
    "openai",
]
# Self-referential so it can never drift out of sync with the extras above.
all = [
    "ctm-toolkit[report,preview,llm]",
]
# Test/lint tooling. An extra rather than a PEP 735 dependency-group so plain
# `pip install ".[dev]"` works in the Dockerfile without a pip 25.1+ floor.
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
ctm-mm = "ctm.mm_cli:main"
ctm-report = "ctm.report_cli:main"
ctm-fetch = "ctm.fetch_cli:main"
ctm-meta = "ctm.meta_cli:main"
ctm-ctml = "ctm.ctml_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110          # the CLI help strings and column tables read better wide
target-version = "py311"
extend-exclude = ["data", "output"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — unused imports/variables, undefined names
    "I",        # isort — import ordering
    "UP",       # pyupgrade — modern syntax for the 3.11 floor
    "B",        # bugbear — likely bugs
    "C4",       # comprehension simplifications
    "RUF",      # ruff's own rules
]
ignore = [
    "E501",     # line length is enforced by the formatter, not the linter
    "B008",     # argparse/pydantic defaults legitimately call functions
]

[tool.ruff.lint.per-file-ignores]
# Fixtures and CLI scaffolding assert on long literal dicts; scripts are top-level
# procedural by design.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
